<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HYPE-X</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#050505; color:#ff0033; font-family:'Courier New',Courier,monospace; overflow:hidden; height:100vh; width:100vw; }
#matrix { position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; }
#app { position:relative; z-index:1; display:flex; flex-direction:column; height:100vh; background:rgba(5,5,5,0.88); }
header { display:flex; align-items:center; justify-content:space-between; padding:10px 20px; border-bottom:1px solid #ff0033; background:rgba(0,0,0,0.95); }
.logo-container { display:inline-flex; align-items:center; font-size:1.8rem; font-weight:bold; letter-spacing:2px; }
.logo-letter { display:inline-block; transition:opacity 0.1s, transform 0.05s; text-shadow:0 0 10px #ff0033; }
.logo-x { display:inline-block; color:#fff; text-shadow:0 0 15px #ff0033, 0 0 30px #ff0033; animation:sweep 12s infinite ease-in-out; position:relative; z-index:2; }
@keyframes sweep {
  0%,100% { transform:translateX(0) rotate(0deg); }
  45% { transform:translateX(-220px) rotate(720deg); }
  50% { transform:translateX(-220px) rotate(720deg); }
  95% { transform:translateX(0) rotate(0deg); }
}
.nav-btn { background:transparent; border:1px solid #ff0033; color:#ff0033; padding:6px 16px; margin-left:10px; cursor:pointer; font-family:inherit; text-transform:uppercase; transition:all 0.2s; }
.nav-btn:hover,.nav-btn.active { background:#ff0033; color:#000; box-shadow:0 0 15px #ff0033; }
#main { display:flex; flex:1; overflow:hidden; }
#sidebar { width:260px; border-right:1px solid #ff0033; background:rgba(0,0,0,0.95); display:flex; flex-direction:column; padding:10px; overflow-y:auto; }
.panel { margin-bottom:15px; }
.panel h3 { font-size:0.9rem; margin-bottom:8px; border-bottom:1px solid #ff0033; padding-bottom:4px; }
#project-list { max-height:180px; overflow-y:auto; margin-bottom:8px; }
.project-item { display:flex; justify-content:space-between; align-items:center; padding:4px 6px; margin-bottom:4px; border:1px solid #330011; cursor:pointer; font-size:0.85rem; }
.project-item:hover,.project-item.active { background:#ff0033; color:#000; }
.project-item button { background:transparent; border:none; color:inherit; cursor:pointer; font-weight:bold; padding:0 4px; }
.side-btn { width:100%; background:transparent; border:1px solid #ff0033; color:#ff0033; padding:6px; margin-bottom:6px; cursor:pointer; font-family:inherit; text-transform:uppercase; font-size:0.8rem; }
.side-btn:hover { background:#ff0033; color:#000; }
#workspace { flex:1; display:flex; flex-direction:column; overflow:hidden; position:relative; }
.view { display:none; flex:1; flex-direction:column; overflow:hidden; }
.view.active { display:flex; }
.editor-tabs { display:flex; border-bottom:1px solid #ff0033; }
.editor-tabs button { flex:1; background:transparent; border:none; border-right:1px solid #ff0033; color:#ff0033; padding:8px; cursor:pointer; font-family:inherit; text-transform:uppercase; font-size:0.8rem; }
.editor-tabs button:last-child { border-right:none; }
.editor-tabs button:hover,.editor-tabs button.active { background:#ff0033; color:#000; }
.editor-panes { flex:1; position:relative; overflow:hidden; }
.editor-panes textarea { position:absolute; top:0; left:0; width:100%; height:100%; background:#0a0a0a; color:#ff3366; border:none; padding:10px; font-family:'Courier New',monospace; font-size:0.9rem; resize:none; outline:none; tab-size:2; }
.preview-bar { display:flex; gap:10px; padding:8px; border-top:1px solid #ff0033; border-bottom:1px solid #ff0033; background:#000; }
.preview-bar button { background:transparent; border:1px solid #ff0033; color:#ff0033; padding:4px 12px; cursor:pointer; font-family:inherit; }
.preview-bar button:hover { background:#ff0033; color:#000; }
#preview { flex:1; border:none; background:#fff; width:100%; }
#aura-view { position:relative; background:#000; }
.aura-controls { display:flex; gap:10px; padding:10px; border-bottom:1px solid #ff0033; align-items:center; flex-wrap:wrap; }
.aura-controls input,.aura-controls select,.aura-controls button { background:#0a0a0a; border:1px solid #ff0033; color:#ff0033; padding:6px 10px; font-family:inherit; cursor:pointer; }
.aura-controls button:hover { background:#ff0033; color:#000; }
#aura-canvas { flex:1; width:100%; display:block; }
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:#000; }
::-webkit-scrollbar-thumb { background:#ff0033; }
</style>
</head>
<body>

<<canvas id="matrix"></canvas>

<div id="app">
  <header>
    <div class="logo-container" id="logo">
      <span class="logo-letter" data-i="0">H</span>
      <span class="logo-letter" data-i="1">Y</span>
      <span class="logo-letter" data-i="2">P</span>
      <span class="logo-letter" data-i="3">E</span>
      <span class="logo-letter" data-i="4">-</span>
      <span class="logo-x">X</span>
    </div>
    <div>
      <button class="nav-btn active" data-view="editor">EDITOR</button>
      <button class="nav-btn" data-view="aura">AURA</button>
    </div>
  </header>

  <div id="main">
    <aside id="sidebar">
      <div class="panel">
        <h3>PROJECTS</h3>
        <div id="project-list"></div>
        <button class="side-btn" id="btn-new-project">+ NEW PROJECT</button>
      </div>
      <div class="panel">
        <h3>DATA</h3>
        <button class="side-btn" id="btn-export">EXPORT JSON</button>
        <button class="side-btn" id="btn-import">IMPORT JSON</button>
        <input type="file" id="import-file" accept=".json" hidden>
      </div>
    </aside>

    <div id="workspace">
      <div class="view active" id="editor-view">
        <div class="editor-tabs">
          <button data-tab="html5" class="active">HTML5</button>
          <button data-tab="css3">CSS3</button>
          <button data-tab="js">JS</button>
          <button data-tab="mixed">MIXED</button>
        </div>
        <div class="editor-panes">
          <textarea id="code-html5" spellcheck="false" placeholder="<!-- HTML -->"></textarea>
          <textarea id="code-css3" spellcheck="false" placeholder="/* CSS */" style="display:none"></textarea>
          <textarea id="code-js" spellcheck="false" placeholder="// JS" style="display:none"></textarea>
          <textarea id="code-mixed" spellcheck="false" placeholder="<!-- Complete HTML document -->" style="display:none"></textarea>
        </div>
        <div class="preview-bar">
          <button id="btn-run">RUN ▶</button>
          <button id="btn-fullscreen">FULLSCREEN</button>
        </div>
        <iframe id="preview" sandbox="allow-scripts allow-modals allow-same-origin"></iframe>
      </div>

      <div class="view" id="aura-view">
        <div class="aura-controls">
          <input type="file" id="audio-file" accept="audio/*">
          <button id="btn-mic">MIC</button>
          <button id="btn-synth">SYNTH</button>
          <select id="aura-mode">
            <option value="tree">Tree of Seasons</option>
            <option value="dream">Dreamscape</option>
          </select>
          <button id="btn-play-aura">PLAY</button>
          <button id="btn-stop-aura">STOP</button>
        </div>
        <canvas id="aura-canvas"></canvas>
      </div>
    </div>
  </div>
</div>

<script src="js/three.min.js"></script>
<script>
if (typeof THREE === 'undefined') {
  var s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
  document.head.appendChild(s);
}
</script>
<script src="js/matrix.js"></script>
<script src="js/aura.js"></script>
<script src="js/app.js"></script>
</body>
</html>
