<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURA // Immersive Audiovisual Engine</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--bg-dark:#030305;--panel-bg:rgba(10,10,15,0.7);--border-color:rgba(255,255,255,0.08);--neon-green:#00ffaa;--neon-magenta:#ff007f;--neon-cyan:#00f0ff;--text-primary:#f8f9fa;--text-muted:#868e96;--font-ui:'Inter',sans-serif;--font-display:'Orbitron',sans-serif}
*{box-sizing:border-box;user-select:none}
html,body{margin:0;padding:0;width:100%;height:100%;background-color:var(--bg-dark);color:var(--text-primary);font-family:var(--font-ui);overflow:hidden}
#stage{position:absolute;top:0;left:0;width:100vw;height:100vh;z-index:1;display:block}
.app-container{position:absolute;top:0;left:0;width:100vw;height:100vh;z-index:2;pointer-events:none;display:flex;flex-direction:column}
.glass-panel{background:var(--panel-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--border-color);border-radius:8px;pointer-events:auto;box-shadow:0 8px 32px 0 rgba(0,0,0,0.5)}
.panel{position:absolute;top:0;left:0;width:100vw;height:100vh;display:flex;justify-content:center;align-items:center;opacity:0;visibility:hidden;transition:opacity 0.6s cubic-bezier(0.25,1,0.5,1),visibility 0.6s;z-index:100}
.panel.active{opacity:1;visibility:visible}
.upload-box{position:relative;width:500px;padding:48px;text-align:center;border-radius:16px;cursor:pointer;background:rgba(8,8,12,0.85);border:1px solid rgba(0,255,170,0.15);transition:transform 0.4s ease,border-color 0.4s ease;pointer-events:auto}
.upload-box:hover{transform:scale(1.02);border-color:var(--neon-green)}
.pulse-icon{margin-bottom:24px;color:var(--neon-green);animation:pulseGlow 2.5s infinite alternate}
.upload-content h1{font-family:var(--font-display);font-weight:900;letter-spacing:4px;margin-bottom:12px;background:linear-gradient(45deg,#fff,var(--text-muted));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.upload-content p{color:var(--text-muted);font-size:14px;margin-bottom:8px}
.file-spec{font-size:11px;color:rgba(255,255,255,0.3);letter-spacing:1px;text-transform:uppercase}
#audio-input{display:none}
.hud-layer{width:100%;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:24px;opacity:0;visibility:hidden;transition:opacity 1s cubic-bezier(0.25,1,0.5,1)}
.hud-layer.active{opacity:1;visibility:visible}
.hud-top-bar{display:flex;justify-content:space-between;align-items:center;width:100%}
.track-info{display:flex;flex-direction:column}
.track-name{font-family:var(--font-display);font-size:16px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#fff;text-shadow:0 0 10px rgba(255,255,255,0.2)}
.system-status{font-size:10px;letter-spacing:2px;color:var(--neon-green);margin-top:4px;font-weight:600}
.visualizer-selector{padding:4px;display:flex;gap:4px}
.selector-btn{background:transparent;border:none;color:var(--text-muted);font-family:var(--font-display);font-size:11px;font-weight:700;padding:10px 20px;cursor:pointer;border-radius:4px;transition:all 0.3s cubic-bezier(0.25,1,0.5,1);letter-spacing:1px}
.selector-btn:hover{color:#fff}
.selector-btn.active{background:rgba(255,255,255,0.08);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,0.1)}
.hud-side-panel{position:absolute;top:100px;width:240px;padding:16px}
.left-panel{left:24px}
.hud-side-panel h3{font-family:var(--font-display);font-size:11px;letter-spacing:1.5px;margin:0 0 16px 0;color:var(--text-muted)}
.context-content{display:none}
.context-content.active{display:block}
.timeline-status{display:flex;flex-direction:column;margin-bottom:14px}
.timeline-status .label{font-size:9px;color:var(--text-muted);letter-spacing:1px}
.timeline-status .value-highlight{font-family:var(--font-display);font-size:14px;font-weight:700;margin-top:2px;color:var(--neon-cyan);letter-spacing:1px}
.season-progress-track{display:flex;justify-content:space-between;position:relative;padding:8px 4px}
.season-progress-track::before{content:'';position:absolute;top:50%;left:0;width:100%;height:2px;background:rgba(255,255,255,0.1);transform:translateY(-50%);z-index:1}
.season-dot{width:10px;height:10px;border-radius:50%;background:#212529;border:2px solid var(--text-muted);z-index:2;cursor:pointer;transition:all 0.3s ease}
.season-dot:hover{transform:scale(1.3);background:#fff}
.season-dot.active{background:var(--bg-dark);border-color:var(--neon-cyan);box-shadow:0 0 8px var(--neon-cyan);transform:scale(1.2)}
.telemetry-row{display:flex;justify-content:space-between;font-size:11px;font-family:var(--font-display);margin-bottom:10px;letter-spacing:0.5px}
.neon-magenta{color:var(--neon-magenta);text-shadow:0 0 4px rgba(255,0,127,0.3)}
.neon-cyan{color:var(--neon-cyan);text-shadow:0 0 4px rgba(0,240,255,0.3)}
.hud-bottom-bar{width:100%;padding:16px 24px;display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;gap:24px}
.control-group{display:flex;align-items:center}
.control-group.left{justify-content:flex-start;gap:16px}
.control-group.center{justify-content:center;width:100%}
.control-group.right{justify-content:flex-end}
.icon-btn{background:transparent;border:none;color:#fff;cursor:pointer;display:flex;justify-content:center;align-items:center;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.05);transition:all 0.2s cubic-bezier(0.25,1,0.5,1)}
.icon-btn:hover{background:rgba(255,255,255,0.1);transform:scale(1.05);border-color:rgba(255,255,255,0.2)}
.hidden{display:none !important}
.volume-container{display:flex;align-items:center;gap:8px;color:var(--text-muted)}
#slider-volume{-webkit-appearance:none;appearance:none;width:80px;height:3px;background:rgba(255,255,255,0.1);border-radius:2px;outline:none;transition:width 0.3s ease}
#slider-volume::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:50%;background:#fff;cursor:pointer;transition:transform 0.1s ease}
#slider-volume::-webkit-slider-thumb:hover{transform:scale(1.3)}
.progress-wrapper{gap:12px;width:100%}
.time-stamp{font-family:var(--font-display);font-size:10px;color:var(--text-muted);letter-spacing:0.5px;min-width:35px}
.progress-bar-container{flex-grow:1;height:4px;background:rgba(255,255,255,0.08);border-radius:2px;cursor:pointer;position:relative}
.progress-fill{width:0%;height:100%;background:linear-gradient(90deg,var(--neon-cyan),var(--neon-magenta));border-radius:2px;position:absolute;top:0;left:0;box-shadow:0 0 8px rgba(0,240,255,0.5)}
@keyframes pulseGlow{0%{filter:drop-shadow(0 0 2px rgba(0,255,170,0.2));opacity:0.8}100%{filter:drop-shadow(0 0 12px rgba(0,255,170,0.6));opacity:1}}
.glow-accent{position:absolute;top:0;left:50%;transform:translateX(-50%);width:60%;height:1px;background:linear-gradient(90deg,transparent,var(--neon-green),transparent);filter:blur(1px)}
.url-row{position:absolute;bottom:100px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:101;pointer-events:auto}
.url-input{background:rgba(8,8,12,0.9);border:1px solid rgba(0,255,170,0.3);color:#fff;padding:10px 14px;font-family:var(--font-ui);font-size:12px;outline:none;border-radius:4px;width:300px;letter-spacing:0.5px}
.url-input:focus{border-color:var(--neon-green)}
.url-btn{background:rgba(0,255,170,0.1);border:1px solid var(--neon-green);color:var(--neon-green);padding:10px 16px;font-family:var(--font-display);font-size:10px;letter-spacing:1px;cursor:pointer;border-radius:4px;text-transform:uppercase;transition:all 0.2s}
.url-btn:hover{background:var(--neon-green);color:#000}
.preset-row{display:flex;gap:8px;margin-top:12px;justify-content:center}
.preset-btn{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);color:var(--text-muted);padding:6px 12px;font-family:var(--font-display);font-size:9px;letter-spacing:1px;cursor:pointer;border-radius:4px;text-transform:uppercase;transition:all 0.2s}
.preset-btn:hover{border-color:var(--neon-green);color:var(--neon-green)}
@media (max-width:768px){.hud-bottom-bar{grid-template-columns:1fr;gap:12px}.hud-side-panel{display:none}.control-group.left,.control-group.right{justify-content:center}.url-row{bottom:140px;width:90%}.url-input{width:100%}}
</style>
</head>
<body>

<<canvas id="stage"></canvas>

<div class="app-container">
    <div id="upload-screen" class="panel active">
        <div class="glass-panel upload-box" id="drop-zone">
            <div class="glow-accent"></div>
            <div class="upload-content">
                <div class="pulse-icon">
                    <svg viewBox="0 0 24 24" width="48" height="48" stroke="currentColor" stroke-width="1.5" fill="none">
                        <path d="M12 2v16M5 9l7-7 7 7M2 22h20" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <h1>AURA VISUALIZER</h1>
                <p>Drag & drop your audio masterpiece, paste a URL, or use a preset</p>
                <span class="file-spec">Supports MP3, WAV, FLAC, OGG, Stream URLs</span>
                <input type="file" id="audio-input" accept="audio/*">
                <div class="preset-row">
                    <button class="preset-btn" onclick="loadPreset('https://stream.nightride.fm/nightride.mp3','SYNTHWAVE')">SYNTHWAVE</button>
                    <button class="preset-btn" onclick="loadPreset('https://coderadio-admin.freecodecamp.org/public/coderadio/256/icecast.audio','CODE RADIO')">CODE RADIO</button>
                    <button class="preset-btn" onclick="loadPreset('https://stream.nightride.fm/nightride.ogg','NIGHT RIDE')">NIGHT RIDE</button>
                </div>
            </div>
        </div>
        <div class="url-row">
            <input type="text" class="url-input" id="url-input" placeholder="https://example.com/stream.mp3">
            <button class="url-btn" onclick="loadFromURL()">LOAD URL</button>
        </div>
    </div>

    <div id="hud-overlay" class="hud-layer">
        <div class="hud-top-bar">
            <div class="track-info">
                <span id="ui-track-name" class="track-name">No Track Loaded</span>
                <span id="ui-system-status" class="system-status">SYSTEM READY</span>
            </div>
            <div class="visualizer-selector glass-panel">
                <button class="selector-btn active" data-visualizer="tree">TREE OF SEASONS</button>
                <button class="selector-btn" data-visualizer="dreamscape">PSYCHEDELIC DREAMSCAPE</button>
            </div>
        </div>

        <div class="hud-side-panel left-panel glass-panel" id="context-panel">
            <h3 id="context-title">ENVIRONMENT CONTROL</h3>
            <div id="tree-controls" class="context-content active">
                <div class="timeline-status">
                    <span class="label">CURRENT STATE:</span>
                    <span id="current-season-tag" class="value-highlight">SPRING</span>
                </div>
                <div class="season-progress-track">
                    <div class="season-dot active" data-season="0" title="Spring"></div>
                    <div class="season-dot" data-season="1" title="Summer"></div>
                    <div class="season-dot" data-season="2" title="Autumn"></div>
                    <div class="season-dot" data-season="3" title="Winter"></div>
                </div>
            </div>
            <div id="dreamscape-controls" class="context-content">
                <div class="telemetry-row">
                    <span>WARP INDEX:</span><span id="telemetry-warp" class="neon-magenta">0.00</span>
                </div>
                <div class="telemetry-row">
                    <span>GLITCH DEV:</span><span id="telemetry-glitch" class="neon-cyan">0.00</span>
                </div>
            </div>
        </div>

        <div class="hud-bottom-bar glass-panel">
            <div class="control-group left">
                <button id="btn-play-pause" class="icon-btn" title="Play/Pause">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" id="svg-play">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" id="svg-pause" class="hidden">
                        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                    </svg>
                </button>
                <div class="volume-container">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
                        <path d="M11 5L6 9H2v6h4l5 4V5zM15.54 8.46a5 5 0 0 1 0 7.07" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <input type="range" id="slider-volume" min="0" max="1" step="0.01" value="0.7">
                </div>
            </div>
            <div class="control-group center progress-wrapper">
                <span id="time-current" class="time-stamp">00:00</span>
                <div class="progress-bar-container" id="progress-container">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
                <span id="time-total" class="time-stamp">00:00</span>
            </div>
            <div class="control-group right">
                <button id="btn-fullscreen" class="icon-btn" title="Toggle Fullscreen">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none">
                        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>
</div>

<script src="js/three.min.js"></script>
<script>
const CONFIG={fftSize:512,smoothingTimeConstant:0.82,seasons:{SPRING:0,SUMMER:1,AUTUMN:2,WINTER:3},seasonDuration:25};
class AudioAnalyzer{constructor(){this.context=null;this.analyser=null;this.source=null;this.audio=null;this.dataArray=null;this.isReady=false;this.bands={bass:0,mids:0,highs:0,full:0};this.beatDetection={energyHistory:[],isBeat:false,threshold:1.15}}init(audioElement){if(this.isReady)return;this.audio=audioElement;const AudioContextClass=window.AudioContext||window.webkitAudioContext;this.context=new AudioContextClass();this.analyser=this.context.createAnalyser();this.analyser.fftSize=CONFIG.fftSize;this.analyser.smoothingTimeConstant=CONFIG.smoothingTimeConstant;this.source=this.context.createMediaElementSource(this.audio);this.source.connect(this.analyser);this.analyser.connect(this.context.destination);this.dataArray=new Uint8Array(this.analyser.frequencyBinCount);this.isReady=true}update(){if(!this.isReady)return;this.analyser.getByteFrequencyData(this.dataArray);let bassSum=0,midsSum=0,highsSum=0,totalSum=0;const len=this.dataArray.length;const bassEnd=Math.floor(len*0.12);const midsEnd=Math.floor(len*0.5);for(let i=0;i<<len;i++){const value=this.dataArray[i]/255;totalSum+=value;if(i<bassEnd)bassSum+=value;else if(i<midsEnd)midsSum+=value;else highsSum+=value}this.bands.bass=bassSum/bassEnd;this.bands.mids=midsSum/(midsEnd-bassEnd);this.bands.highs=highsSum/(len-midsEnd);this.bands.full=totalSum/len;this.evaluateBeatMetrics(this.bands.bass)}evaluateBeatMetrics(currentEnergy){if(this.beatDetection.energyHistory.length>30)this.beatDetection.energyHistory.shift();let avgHistoryEnergy=0;if(this.beatDetection.energyHistory.length>0){let sum=0;for(let i=0;i<<this.beatDetection.energyHistory.length;i++)sum+=this.beatDetection.energyHistory[i];avgHistoryEnergy=sum/this.beatDetection.energyHistory.length}this.beatDetection.energyHistory.push(currentEnergy);if(currentEnergy>avgHistoryEnergy*this.beatDetection.threshold&&currentEnergy>0.3)this.beatDetection.isBeat=true;else this.beatDetection.isBeat=false}}
class WebGLEngine{constructor(canvasId){this.canvas=document.getElementById(canvasId);this.renderer=null;this.activeScene=null;this.activeCamera=null;this.clock=new THREE.Clock();this.renderTarget=null;this.postScene=null;this.postCamera=null;this.postMaterial=null;this.initWebGL()}initWebGL(){this.renderer=new THREE.WebGLRenderer({canvas:this.canvas,antialias:true,powerPreference:"high-performance"});this.renderer.setSize(window.innerWidth,window.innerHeight);this.renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));this.renderTarget=new THREE.WebGLRenderTarget(window.innerWidth,window.innerHeight,{minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,format:THREE.RGBAFormat});this.postScene=new THREE.Scene();this.postCamera=new THREE.OrthographicCamera(-1,1,1,-1,0,1);this.postMaterial=new THREE.ShaderMaterial({uniforms:{tDiffuse:{value:null},uTime:{value:0},uRGBShift:{value:0},uGlitchIntensity:{value:0},uBass:{value:0}},vertexShader:"varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position,1.0);}",fragmentShader:"uniform sampler2D tDiffuse;uniform float uTime;uniform float uRGBShift;uniform float uGlitchIntensity;uniform float uBass;varying vec2 vUv;float rand(vec2 co){return fract(sin(dot(co.xy,vec2(12.9898,78.233)))*43758.5453);}void main(){vec2 uv=vUv;if(uGlitchIntensity>0.1){float splitLine=sin(uv.y*30.0+uTime*10.0);if(splitLine>0.85){uv.x+=sin(uv.y*10.0+uTime)*0.03*uGlitchIntensity;}}float shift=uRGBShift*0.015;vec4 rCol=texture2D(tDiffuse,vec2(uv.x+shift,uv.y));vec4 gCol=texture2D(tDiffuse,uv);vec4 bCol=texture2D(tDiffuse,vec2(uv.x-shift,uv.y));vec4 finalColor=vec4(rCol.r,gCol.g,bCol.b,1.0);float grain=(rand(uv*uTime)-0.5)*0.08;finalColor.rgb+=vec3(grain*(0.5+uBass));float d=distance(uv,vec2(0.5));finalColor.rgb*=smoothstep(0.8,0.35,d*(1.0+uBass*0.15));gl_FragColor=finalColor;}"});const quadGeo=new THREE.PlaneGeometry(2,2);const quadMesh=new THREE.Mesh(quadGeo,this.postMaterial);this.postScene.add(quadMesh);window.addEventListener("resize",()=>this.onResize())}setScene(scene,camera){this.activeScene=scene;this.activeCamera=camera}onResize(){const w=window.innerWidth;const h=window.innerHeight;if(this.activeCamera&&this.activeCamera.isPerspectiveCamera){this.activeCamera.aspect=w/h;this.activeCamera.updateProjectionMatrix()}this.renderer.setSize(w,h);this.renderTarget.setSize(w,h)}render(audioBands,totalTime){if(!this.activeScene||!this.activeCamera)return;this.renderer.setRenderTarget(this.renderTarget);this.renderer.render(this.activeScene,this.activeCamera);this.renderer.setRenderTarget(null);this.postMaterial.uniforms.tDiffuse.value=this.renderTarget.texture;this.postMaterial.uniforms.uTime.value=totalTime;this.postMaterial.uniforms.uBass.value=audioBands.bass;this.postMaterial.uniforms.uRGBShift.value=audioBands.bass*0.65+audioBands.highs*0.35;this.postMaterial.uniforms.uGlitchIntensity.value=audioBands.bass>0.6?audioBands.bass:0;this.renderer.render(this.postScene,this.postCamera)}}
class TreeVisualizer{constructor(){this.scene=new THREE.Scene();this.camera=new THREE.PerspectiveCamera(45,window.innerWidth/window.innerHeight,1,1000);this.scene.background=new THREE.Color(0x020204);this.treeGroup=new THREE.Group();this.scene.add(this.treeGroup);this.particles=null;this.particleCount=4000;this.particleGeometry=null;this.currentSeason=CONFIG.seasons.SPRING;this.seasonWeight=0;this.growthFactor=0.01;this.buildEnvironment()}buildEnvironment(){this.camera.position.set(0,15,45);this.camera.lookAt(0,10,0);const ambientLight=new THREE.AmbientLight(0xffffff,0.15);this.scene.add(ambientLight);this.dirLight=new THREE.DirectionalLight(0xffffff,1);this.dirLight.position.set(5,20,10);this.scene.add(this.dirLight);this.scene.fog=new THREE.FogExp2(0x020204,0.015);this.generateFractalTreeTrunk();this.generateEcosystemParticleCloud()}generateFractalTreeTrunk(){const createBranchMesh=(length,startWidth,endWidth,position,rotation,depth)=>{if(depth>5)return;const geometry=new THREE.CylinderGeometry(endWidth,startWidth,length,7);geometry.translate(0,length/2,0);const material=new THREE.MeshStandardMaterial({color:0x1c1917,roughness:0.88,metalness:0.05});const mesh=new THREE.Mesh(geometry,material);mesh.position.copy(position);mesh.rotation.copy(rotation);mesh.castShadow=true;mesh.userData={baseScale:new THREE.Vector3(1,1,1),depth:depth,length:length,initialRotation:rotation.clone()};this.treeGroup.add(mesh);const subBranches=3;for(let i=0;i<subBranches;i++){const nextLength=length*0.72;const nextStartWidth=endWidth;const nextEndWidth=endWidth*0.65;const nextPos=new THREE.Vector3(0,length,0).applyEuler(rotation).add(position);const nextRot=rotation.clone();nextRot.x+=(Math.random()-0.5)*0.65+0.35;nextRot.y+=(i*(Math.PI*2/subBranches))+(Math.random()-0.5)*0.25;nextRot.z+=(Math.random()-0.5)*0.4;createBranchMesh(nextLength,nextStartWidth,nextEndWidth,nextPos,nextRot,depth+1)}};createBranchMesh(6.5,0.6,0.42,new THREE.Vector3(0,0,0),new THREE.Euler(),0)}generateEcosystemParticleCloud(){this.particleGeometry=new THREE.BufferGeometry();const positions=new Float32Array(this.particleCount*3);const colors=new Float32Array(this.particleCount*3);const randoms=new Float32Array(this.particleCount*3);const posVec=new THREE.Vector3();for(let i=0;i<<this.particleCount;i++){const r=Math.random()*16+2;const theta=Math.random()*Math.PI*2;const phi=Math.acos((Math.random()*2)-1);posVec.set(r*Math.sin(phi)*Math.cos(theta),r*Math.cos(phi)+12,r*Math.sin(phi)*Math.sin(theta));posVec.toArray(positions,i*3);colors[i*3]=0.5;colors[i*3+1]=0.9;colors[i*3+2]=0.5;randoms[i*3]=Math.random();randoms[i*3+1]=Math.random();randoms[i*3+2]=Math.random()}this.particleGeometry.setAttribute("position",new THREE.BufferAttribute(positions,3));this.particleGeometry.setAttribute("color",new THREE.BufferAttribute(colors,3));this.particleGeometry.setAttribute("customRandom",new THREE.BufferAttribute(randoms,3));const particleMaterial=new THREE.ShaderMaterial({uniforms:{uTime:{value:0},uBass:{value:0},uHighs:{value:0},uSeason:{value:0},uGrowth:{value:0}},vertexShader:"uniform float uTime;uniform float uBass;uniform float uHighs;uniform float uSeason;uniform float uGrowth;attribute vec3 customRandom;varying vec3 vColor;varying float vSeason;void main(){vSeason=uSeason;vec3 pos=position;float wave=sin(uTime*1.5+pos.x*0.1+customRandom.x*6.28)*0.4;pos.x+=wave*(1.0+uHighs*2.0);pos.y+=cos(uTime*1.2+pos.z*0.1)*0.3*(1.0+uBass);pos*=clamp(uGrowth,0.001,1.0);if(uSeason>=2.0&&uSeason<<3.0){pos.y-=mod(uTime*(1.0+customRandom.y*2.0)+customRandom.z*50.0,18.0);if(pos.y<<0.0)pos.y+=18.0;}else if(uSeason>=3.0){pos.x+=sin(uTime*3.0+customRandom.z*10.0)*1.5;pos.y-=mod(uTime*2.5+customRandom.y*30.0,20.0);if(pos.y<<0.0)pos.y+=20.0;}vec4 mvPosition=modelViewMatrix*vec4(pos,1.0);gl_PointSize=(8.0+uHighs*15.0)*(300.0/-mvPosition.z)*customRandom.y;vec3 springColor=vec3(0.4,0.85,0.38)+customRandom.x*0.15;vec3 summerColor=vec3(0.05,0.62,0.22);vec3 autumnColor=vec3(0.85,0.35,0.05)*(0.8+customRandom.y*0.4);vec3 winterColor=vec3(0.82,0.92,0.98);if(uSeason<<1.0){vColor=mix(springColor,summerColor,uSeason);}else if(uSeason<<2.0){vColor=mix(summerColor,autumnColor,uSeason-1.0);}else if(uSeason<<3.0){vColor=mix(autumnColor,winterColor,uSeason-2.0);}else{vColor=mix(winterColor,springColor,uSeason-3.0);}gl_Position=projectionMatrix*mvPosition;}",fragmentShader:"varying vec3 vColor;void main(){vec2 circCoord=gl_PointCoord-vec2(0.5);if(dot(circCoord,circCoord)>0.25){discard;}gl_FragColor=vec4(vColor,0.82);}",transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});this.particles=new THREE.Points(this.particleGeometry,particleMaterial);this.scene.add(this.particles)}update(audio,time){if(this.growthFactor<<1)this.growthFactor+=0.003;const trackingTimeline=(time%(CONFIG.seasonDuration*4))/CONFIG.seasonDuration;this.currentSeason=Math.floor(trackingTimeline);this.seasonWeight=trackingTimeline;this.particles.material.uniforms.uTime.value=time;this.particles.material.uniforms.uBass.value=audio.bands.bass;this.particles.material.uniforms.uHighs.value=audio.bands.highs;this.particles.material.uniforms.uSeason.value=this.seasonWeight;this.particles.material.uniforms.uGrowth.value=this.growthFactor;this.treeGroup.children.forEach(mesh=>{const depth=mesh.userData.depth;const initialRot=mesh.userData.initialRotation;const scaleTarget=1+(audio.bands.bass*0.18)/(depth+1);mesh.scale.set(scaleTarget,scaleTarget,scaleTarget);const sway=Math.sin(time*1.2+depth*0.4)*0.04*(1+audio.bands.mids*1.5);mesh.rotation.x=initialRot.x+sway;mesh.rotation.z=initialRot.z+sway*0.5});this.treeGroup.rotation.y=time*0.04;this.dirLight.intensity=0.8+audio.bands.bass*0.5;if(this.currentSeason===CONFIG.seasons.AUTUMN)this.dirLight.color.setHex(0xffaa44);else if(this.currentSeason===CONFIG.seasons.WINTER)this.dirLight.color.setHex(0x88ccff);else this.dirLight.color.setHex(0xffffff)}}
class DreamscapeVisualizer{constructor(){this.scene=new THREE.Scene();this.camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,0.1,1000);this.scene.background=new THREE.Color(0x010102);this.tunnelGroup=new THREE.Group();this.scene.add(this.tunnelGroup);this.centralMesh=null;this.starField=null;this.starCount=2500;this.buildDreamscapeEnvironment()}buildDreamscapeEnvironment(){this.camera.position.set(0,0,12);this.scene.fog=new THREE.FogExp2(0x010102,0.045);const torusGeo=new THREE.TorusKnotGeometry(3.5,0.8,160,16);this.dreamMaterial=new THREE.ShaderMaterial({uniforms:{uTime:{value:0},uBass:{value:0},uMids:{value:0},uHighs:{value:0}},vertexShader:"uniform float uTime;uniform float uBass;varying vec2 vUv;varying vec3 vNormal;varying vec3 vViewPosition;void main(){vUv=uv;vNormal=normalize(normalMatrix*normal);vec3 pos=position;float distortion=sin(pos.x*2.0+uTime*4.0)*cos(pos.y*2.0+uTime*3.0)*0.25;pos+=normal*distortion*(1.0+uBass*2.5);vec4 mvPosition=modelViewMatrix*vec4(pos,1.0);vViewPosition=-mvPosition.xyz;gl_Position=projectionMatrix*mvPosition;}",fragmentShader:"uniform float uTime;uniform float uBass;uniform float uMids;uniform float uHighs;varying vec2 vUv;varying vec3 vNormal;void main(){vec2 uv=vUv;float r=sin(uv.x*12.0+uTime*2.0)*0.5+0.5;float g=cos(uv.y*8.0-uTime*1.5)*0.5+0.5;float b=sin((uv.x+uv.y)*4.0+uTime*3.0)*0.5+0.5;vec3 baseColor=vec3(r*0.8,0.0,g*0.9)*(0.4+uMids);vec3 neonCyan=vec3(0.0,0.94,1.0)*vec3(b);vec3 composition=mix(baseColor,neonCyan,0.35+uBass*0.4);float fresnel=pow(1.0-max(dot(normalize(vNormal),vec3(0.0,0.0,1.0)),0.0),3.0);composition+=vec3(0.9,0.0,0.5)*fresnel*(1.0+uHighs*4.0);gl_FragColor=vec4(composition,1.0);}",wireframe:true});this.centralMesh=new THREE.Mesh(torusGeo,this.dreamMaterial);this.tunnelGroup.add(this.centralMesh);this.buildStarFieldTunnel()}buildStarFieldTunnel(){const starGeo=new THREE.BufferGeometry();const positions=new Float32Array(this.starCount*3);for(let i=0;i<<this.starCount;i++){const radius=Math.random()*8+4;const theta=Math.random()*Math.PI*2;positions[i*3]=radius*Math.cos(theta);positions[i*3+1]=radius*Math.sin(theta);positions[i*3+2]=(Math.random()-0.5)*80}starGeo.setAttribute("position",new THREE.BufferAttribute(positions,3));const starMat=new THREE.PointsMaterial({color:0xff00ff,size:0.12,transparent:true,opacity:0.85,blending:THREE.AdditiveBlending,depthWrite:false});this.starField=new THREE.Points(starGeo,starMat);this.tunnelGroup.add(this.starField)}update(audio,time){this.dreamMaterial.uniforms.uTime.value=time;this.dreamMaterial.uniforms.uBass.value=audio.bands.bass;this.dreamMaterial.uniforms.uMids.value=audio.bands.mids;this.dreamMaterial.uniforms.uHighs.value=audio.bands.highs;this.centralMesh.rotation.x=time*0.22;this.centralMesh.rotation.y=time*0.35;const positions=this.starField.geometry.attributes.position.array;const len=positions.length;const velocity=0.12+audio.bands.bass*0.45;for(let i=2;i<<len;i+=3){positions[i]+=velocity;if(positions[i]>20)positions[i]=-60}this.starField.geometry.attributes.position.needsUpdate=true;if(audio.beatDetection.isBeat){this.tunnelGroup.position.z=audio.bands.bass*1.5;this.camera.rotation.z=Math.sin(time*2)*0.15}else{this.tunnelGroup.position.z+=(0-this.tunnelGroup.position.z)*0.1;this.camera.rotation.z+=(0-this.camera.rotation.z)*0.05}this.tunnelGroup.rotation.z=time*0.05}}
class ApplicationOrchestrator{constructor(){this.audioElement=new Audio();this.audioElement.crossOrigin="anonymous";this.audioElement.loop=true;this.analyzer=new AudioAnalyzer();this.engine=new WebGLEngine("stage");this.visualizers={tree:new TreeVisualizer(),dreamscape:new DreamscapeVisualizer()};this.activeKey="tree";this.initDOMBindings();this.bootRenderLoopProcessingEngine()}initDOMBindings(){const dropZone=document.getElementById("drop-zone");const fileInput=document.getElementById("audio-input");const playBtn=document.getElementById("btn-play-pause");const volSlider=document.getElementById("slider-volume");const progressContainer=document.getElementById("progress-container");const fullscreenBtn=document.getElementById("btn-fullscreen");this.engine.setScene(this.visualizers[this.activeKey].scene,this.visualizers[this.activeKey].camera);dropZone.addEventListener("click",()=>fileInput.click());dropZone.addEventListener("dragover",e=>{e.preventDefault();dropZone.style.borderColor="#00f0ff"});dropZone.addEventListener("dragleave",()=>dropZone.style.borderColor="rgba(0,255,170,0.15)");dropZone.addEventListener("drop",e=>{e.preventDefault();if(e.dataTransfer.files.length>0)this.ingestAudioFile(e.dataTransfer.files[0])});fileInput.addEventListener("change",e=>{if(e.target.files.length>0)this.ingestAudioFile(e.target.files[0])});playBtn.addEventListener("click",()=>this.togglePlaybackState());volSlider.addEventListener("input",e=>this.audioElement.volume=e.target.value);progressContainer.addEventListener("click",e=>{const rect=progressContainer.getBoundingClientRect();const pct=(e.clientX-rect.left)/rect.width;if(!isNaN(this.audioElement.duration))this.audioElement.currentTime=pct*this.audioElement.duration});fullscreenBtn.addEventListener("click",()=>this.toggleFullscreenContext());document.querySelectorAll(".selector-btn").forEach(btn=>{btn.addEventListener("click",e=>{document.querySelectorAll(".selector-btn").forEach(b=>b.classList.remove("active"));e.target.classList.add("active");const targetKey=e.target.getAttribute("data-visualizer");this.switchActiveVisualizer(targetKey)})});document.querySelectorAll(".season-dot").forEach(dot=>{dot.addEventListener("click",e=>{const requestedSeason=parseInt(e.target.getAttribute("data-season"));const targetTimeOffset=requestedSeason*CONFIG.seasonDuration;const engineTime=this.engine.clock.getElapsedTime();const cyclicalBase=Math.floor(engineTime/(CONFIG.seasonDuration*4))*(CONFIG.seasonDuration*4);this.visualizers.tree.growthFactor=1})})}ingestAudioFile(file){const reader=new FileReader();reader.onload=e=>{this.audioElement.src=e.target.result;document.getElementById("ui-track-name").innerText=file.name;document.getElementById("upload-screen").classList.remove("active");document.getElementById("hud-overlay").classList.add("active");this.analyzer.init(this.audioElement);this.audioElement.play();this.updateMediaPlaybackIcons(true)};reader.readAsDataURL(file)}loadFromURL(url,name){this.audioElement.src=url;document.getElementById("ui-track-name").innerText=name||url.split("/").pop()||"STREAM";document.getElementById("upload-screen").classList.remove("active");document.getElementById("hud-overlay").classList.add("active");this.analyzer.init(this.audioElement);this.audioElement.play();this.updateMediaPlaybackIcons(true)}togglePlaybackState(){if(!this.analyzer.isReady)return;if(this.audioElement.paused){this.audioElement.play();this.updateMediaPlaybackIcons(true)}else{this.audioElement.pause();this.updateMediaPlaybackIcons(false)}}updateMediaPlaybackIcons(isPlaying){const sPlay=document.getElementById("svg-play");const sPause=document.getElementById("svg-pause");if(isPlaying){sPlay.classList.add("hidden");sPause.classList.remove("hidden")}else{sPlay.classList.remove("hidden");sPause.classList.add("hidden")}}switchActiveVisualizer(key){if(key===this.activeKey)return;this.activeKey=key;this.engine.setScene(this.visualizers[key].scene,this.visualizers[key].camera);this.engine.onResize();document.querySelectorAll(".context-content").forEach(el=>el.classList.remove("active"));document.getElementById(key+"-controls").classList.add("active");const titleText=key==="tree"?"ENVIRONMENT CONTROL":"TELEMETRY STATUS SYSTEM";document.getElementById("context-title").innerText=titleText}toggleFullscreenContext(){if(!document.fullscreenElement){document.documentElement.requestFullscreen().catch(err=>console.error(err))}else{document.exitFullscreen()}}formatTimeDisplayMetrics(seconds){if(isNaN(seconds))return"00:00";const mins=Math.floor(seconds/60);const secs=Math.floor(seconds%60);return String(mins).padStart(2,"0")+":"+String(secs).padStart(2,"0")}updateUIDashboardMetrics(currentTime,durationTime){const progressPct=(currentTime/durationTime)*100;document.getElementById("progress-fill").style.width=(isNaN(progressPct)?0:progressPct)+"%";document.getElementById("time-current").innerText=this.formatTimeDisplayMetrics(currentTime);document.getElementById("time-total").innerText=this.formatTimeDisplayMetrics(durationTime);if(this.activeKey==="tree"){const seasonLabels=["SPRING","SUMMER","AUTUMN","WINTER"];const activeSeasonIndex=this.visualizers.tree.currentSeason;document.getElementById("current-season-tag").innerText=seasonLabels[activeSeasonIndex];document.querySelectorAll(".season-dot").forEach((dot,idx)=>{if(idx===activeSeasonIndex)dot.classList.add("active");else dot.classList.remove("active")})}else if(this.activeKey==="dreamscape"){document.getElementById("telemetry-warp").innerText=(this.analyzer.bands.bass*4.5).toFixed(2);document.getElementById("telemetry-glitch").innerText=(this.analyzer.bands.highs*2).toFixed(2)}}bootRenderLoopProcessingEngine(){const step=()=>{requestAnimationFrame(step);const totalElapsedTime=this.engine.clock.getElapsedTime();this.analyzer.update();const activeVisualizerInstance=this.visualizers[this.activeKey];activeVisualizerInstance.update(this.analyzer,totalElapsedTime);this.engine.render(this.analyzer.bands,totalElapsedTime);if(this.analyzer.isReady)this.updateUIDashboardMetrics(this.audioElement.currentTime,this.audioElement.duration)};requestAnimationFrame(step)}}
window.addEventListener("DOMContentLoaded",()=>{window.AURA_APPLICATION_CORE=new ApplicationOrchestrator()});
